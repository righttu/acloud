name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [acloud-mcp-s, acloud-agent, acloud-sandbox]
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f "${{ matrix.app }}/package.json" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "skip: ${{ matrix.app }} not present"; fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.yes == 'true'
        with:
          node-version: 22
      - name: install
        if: steps.exists.outputs.yes == 'true'
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: typecheck
        if: steps.exists.outputs.yes == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run check
      - name: wrangler dry-run
        if: steps.exists.outputs.yes == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run dryrun
